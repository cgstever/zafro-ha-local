# Fake nbrowan cloud for the Zafro/I4season AC.
# Terminates the AC's TLS locally and proxies REST + MQTT-over-WebSocket to
# zafro_cloud.py on 127.0.0.1:8765.
#
# TWO ESSENTIAL DETAILS (see README "Gotchas"):
#   * default_server  — the AC sends NO SNI, so this must be the default vhost.
#   * the ssl_ciphers line ENABLES the AC's old ciphers without DISABLING modern
#     ones. The AC only offers TLS 1.2 RSA-CBC suites (which modern OpenSSL hides),
#     so "DEFAULT:@SECLEVEL=0" re-allows them while keeping modern TLS available.
#     This matters because, as the default_server, this block also terminates TLS
#     for any client that reaches the box with non-matching SNI (e.g. a Cloudflare
#     Tunnel / reverse proxy in front of other vhosts) — so it must still speak
#     modern TLS, or those other sites break with 502s.

map $http_upgrade $zafro_conn { default upgrade; '' close; }

server {
    listen 443 ssl default_server;
    server_name zafro.nbrowan.com;

    ssl_certificate     /etc/zafro-cloud/cert.pem;
    ssl_certificate_key /etc/zafro-cloud/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "DEFAULT:@SECLEVEL=0";
    ssl_prefer_server_ciphers off;

    location /ws/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zafro_conn;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }
}
